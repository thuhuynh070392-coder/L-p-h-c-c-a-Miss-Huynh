<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Siêu Nhân Kỹ Năng Số</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Quicksand', 'sans-serif'],
            },
            colors: {
              'primary': '#059669',   // Emerald 600 - Stronger green
              'primary-light': '#34D399', // Emerald 400
              'secondary': '#0D9488', // Teal 600
              'accent': '#F59E0B',    // Amber 500
              'accent-hover': '#D97706',
              'soft-green': '#ECFDF5', // Emerald 50
              'cream': '#FFFBEB', // Amber 50
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'float-delayed': 'float 6s ease-in-out 3s infinite',
              'bounce-slow': 'bounce 3s infinite',
              'blob': 'morph 8s ease-in-out infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              },
              morph: {
                '0%, 100%': { borderRadius: '40% 60% 70% 30% / 40% 50% 60% 50%' },
                '34%': { borderRadius: '70% 30% 50% 50% / 30% 30% 70% 70%' },
                '67%': { borderRadius: '100% 60% 60% 100% / 100% 100% 60% 60%' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Quicksand', sans-serif;
        background-color: #F0FDFA;
        overflow-x: hidden;
      }
      
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1; 
      }
      ::-webkit-scrollbar-thumb {
        background: #10B981; 
        border-radius: 5px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #059669; 
      }
    </style>
